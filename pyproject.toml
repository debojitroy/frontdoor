[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "frontdoor"
version = "0.1.0"
description = "An inspectable local spam and phishing screening workbench powered by Laya."
requires-python = ">=3.11"
license = "MIT"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1", "python-dotenv>=1,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11", "scikit-learn>=1.6,<2"]
inference = ["laya==0.3.20", "torch>=2.6,<3", "transformers>=4.48,<6"]
bedrock = ["boto3>=1.42,<2"]

[tool.hatch.build.targets.wheel]
packages = ["server/frontdoor"]

[tool.pytest.ini_options]
testpaths = ["server/tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100
