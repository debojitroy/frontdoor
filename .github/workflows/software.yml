name: Software and evidence
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: uv sync --frozen --extra dev --python 3.13
      - run: uv run ruff check server scripts
      - run: uv run ruff format --check server scripts
      - run: uv run pytest -q
      - run: uv run python scripts/benchmark.py --verify evals/specialist.json
      - run: npm ci
      - run: npx prettier --check src e2e playwright.config.ts vite.config.ts
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-evidence
          path: test-results/
          retention-days: 7
